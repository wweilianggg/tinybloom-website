<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Volunteer Management — Admin</title>
    <link rel="stylesheet" href="../css/style.css" />
</head>

<body>
    <div class="admin-layout">
        <div id="admin-sidebar-placeholder"></div>

        <div class="admin-content">
            <div class="admin-header"
                style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;flex-wrap:wrap;gap:1rem">

                <h1 style="margin:0">Volunteer Management</h1>

                <div style="display:flex;gap:0.75rem;align-items:center;flex-wrap:wrap">
                    <select id="status-filter" onchange="loadRequests()" style="
        padding:0.6rem 0.9rem;
        border-radius:999px;
        border:1px solid rgba(92,79,74,0.12);
        background:white;
        min-width:140px;
        font-family:'DM Sans',sans-serif;
        font-size:0.88rem;
    ">
                        <option value="">All Status</option>
                        <option value="pending">Pending</option>
                        <option value="approved">Approved</option>
                        <option value="rejected">Rejected</option>
                    </select>

                    <input type="text" id="search-box" placeholder="Search name or email..." oninput="renderRequests()"
                        style="
        padding:0.6rem 0.9rem;
        border-radius:999px;
        border:1px solid rgba(92,79,74,0.12);
        background:white;
        min-width:240px;
        font-family:'DM Sans',sans-serif;
        font-size:0.88rem;
    " />
                </div>
            </div>

            <div class="card" style="padding:0;overflow:hidden">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Expertise</th>
                            <th style="width:100px">Experience</th>
                            <th style="width:100px">Status</th>
                            <th style="width:110px">Joined</th>
                            <th style="width:220px">Actions</th>
                        </tr>
                    </thead>

                    <tbody id="request-table">
                        <tr>
                            <td colspan="7" style="text-align:center;padding:2rem;color:var(--text-light)">
                                Loading...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <div id="details-modal"
        style="display:none;position:fixed;inset:0;background:rgba(44,36,32,0.4);z-index:9999;align-items:center;justify-content:center">
        <div class="card" style="width:520px;max-width:90%;max-height:85vh;overflow:auto">
            <h3 style="font-family:'Playfair Display',serif;font-size:1.3rem;margin-bottom:1rem">
                Volunteer Application Details
            </h3>

            <div id="details-content" style="font-size:0.9rem;line-height:1.8;color:var(--text-mid)"></div>

            <div style="margin-top:1.5rem;display:flex;justify-content:flex-end;gap:0.75rem" id="details-actions">
                <button class="btn btn-ghost" onclick="closeDetailsModal()">Close</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/app.js"></script>

    <script>
        let requests = [];

        document.addEventListener('DOMContentLoaded', async () => {
            await requireAdmin();
            await loadRequests();
        });

        async function loadRequests() {
            const tbody = document.getElementById('request-table');
            const status = document.getElementById('status-filter').value;

            tbody.innerHTML = `

            <tr>
                <td colspan="7" style="text-align:center;padding:2rem;color:var(--text-light)">
                    Loading...
                    </td>
                    </tr>
                    `;

            try {
                let query = supabaseClient
                    .from('volunteer_profiles')
                    .select(`
                    id,
                    user_id,
                    expertise,
                    certification,
                    years_experience,
                    affiliation,
                    document_path,
                    approval_status,
                    is_verified,
                    verified_at,
                    created_at,
                    profiles:user_id (
                    full_name,
                    email,
                    phone
                    )
                    `)
                    .order('created_at', { ascending: false });

                if (status) {
                    query = query.eq('approval_status', status);
                }

                const { data, error } = await query;

                if (error) throw error;

                requests = (data || []).map(item => ({
                    id: item.id,
                    user_id: item.user_id,
                    name: item.profiles?.full_name || '-',
                    email: item.profiles?.email || '-',
                    phone: item.profiles?.phone || '-',
                    expertise: item.expertise || '-',
                    license_number: item.certification || '-',
                    experience: item.years_experience || 0,
                    affiliation: item.affiliation || '-',
                    document_path: item.document_path || null,
                    status: item.approval_status || 'pending',
                    created_at: item.created_at
                }));

                renderRequests();

                const params = new URLSearchParams(window.location.search);
                const viewId = params.get('view');
                if (viewId) {
                const match = requests.find(r => r.id === viewId);
                if (match) viewDetails(viewId);
                    }

            } catch (error) {
                tbody.innerHTML = `
                <tr>
                    <td colspan="7" style="text-align:center;color:#c0392b;padding:2rem">
                        Error: ${error.message}
                        </td>
                        </tr>
                        `;
            }
        }

        function renderRequests() {
            const tbody = document.getElementById('request-table');
            const search = document.getElementById('search-box').value.toLowerCase();

            const filtered = requests.filter(item =>
                item.name.toLowerCase().includes(search) ||
                item.email.toLowerCase().includes(search) ||
                item.expertise.toLowerCase().includes(search)
            );

            if (filtered.length === 0) {
                tbody.innerHTML = `
                <tr>
                    <td colspan="7" style="text-align:center;padding:2rem;color:var(--text-light)">
                        No volunteer requests found.
                        </td>
                        </tr>
                        `;
                return;
            }

            tbody.innerHTML = filtered.map(item => {
                const joinedDate = item.created_at
                    ? new Date(item.created_at).toLocaleDateString('en-GB', {
                        day: 'numeric',
                        month: 'short',
                        year: 'numeric'
                    })
                    : '-';

                const statusBadge =
                    item.status === 'approved'
                        ? 'badge-green'
                        : item.status === 'rejected'
                            ? 'badge-rose'
                            : 'badge-gold';

                const buttons = `
            <button
            class="btn btn-outline btn-sm"
            onclick="viewDetails('${item.id}')">
            View
            </button>
            <button
            class="btn btn-ghost btn-sm"
            style="color:#c0392b"
            onclick="deleteRequest('${item.id}')">
            Delete
            </button>
            `;

                return `
                <tr>
            <td>${escapeHtml(item.name)}</td>
            <td>${escapeHtml(item.email)}</td>
            <td>${escapeHtml(item.expertise)}</td>
            <td>${escapeHtml(item.experience)} years</td>
            <td>
                <span class="badge ${statusBadge}">
                ${escapeHtml(item.status)}
                </span>
            </td>
            <td>${joinedDate}</td>
            <td>
                <div style="display:flex;gap:0.4rem;flex-wrap:nowrap">
                ${buttons}
                </div>
            </td>
            </tr>
        `;
            }).join('');
        }

        function viewDetails(id) {
            const item = requests.find(r => r.id === id);
            if (!item) return;

            document.getElementById('details-content').innerHTML = `
    <p><strong>Name:</strong> ${escapeHtml(item.name)}</p>
    <p><strong>Email:</strong> ${escapeHtml(item.email)}</p>
    <p><strong>Phone:</strong> ${escapeHtml(item.phone)}</p>
    <hr>

    <p><strong>Area of Expertise:</strong> ${escapeHtml(item.expertise)}</p>
    <p><strong>Certification / License:</strong> ${escapeHtml(item.license_number)}</p>
    <p><strong>Years of Experience:</strong> ${escapeHtml(item.experience)}</p>
    <p><strong>Organisation / Affiliation:</strong> ${escapeHtml(item.affiliation)}</p>
    <hr>
    <p><strong>Status:</strong> ${escapeHtml(item.status)}</p>
    <p><strong>Verification Document:</strong> ${item.document_path ? '<a href="#" onclick="viewDocument(\'' + escapeJsString(item.document_path) + '\');return false;">View Document →</a>' : 'Not uploaded'}</p>
    `;

            const actionsEl = document.getElementById('details-actions');
            actionsEl.innerHTML = item.status === 'pending'
                ? `
                <button class="btn btn-ghost" style="color:#c0392b" onclick="rejectRequest('${item.id}')">Reject</button>
                <button class="btn btn-primary" onclick="approveRequest('${item.id}')">Approve</button>
                <button class="btn btn-ghost" onclick="closeDetailsModal()">Close</button>
                `
                : `<button class="btn btn-ghost" onclick="closeDetailsModal()">Close</button>`;

            document.getElementById('details-modal').style.display = 'flex';
        }

        async function viewDocument(path) {
            const { data, error } = await supabaseClient.storage
                .from('verification-documents')
                .createSignedUrl(path, 60);

            if (error || !data?.signedUrl) {
                showToast('Could not open document.', 'error');
                return;
            }

            window.open(data.signedUrl, '_blank');
        }

        function closeDetailsModal() {
            document.getElementById('details-modal').style.display = 'none';
        }

        async function approveRequest(id) {
            if (!confirm('Approve this volunteer request?')) return;

            const { data: volunteer, error: fetchError } = await supabaseClient
                .from('volunteer_profiles')
                .select(`
                id,
                user_id,
                profiles:user_id (
                email,
                full_name
                )
                `)
                .eq('id', id)
                .single();

            if (fetchError) {
                showToast(fetchError.message, 'error');
                return;
            }

            await supabaseClient
                .from('volunteer_profiles')
                .update({
                    approval_status: 'approved',
                    is_verified: true,
                    verified_at: new Date().toISOString()
                })
                .eq('id', id);

            await supabaseClient
                .from('profiles')
                .update({ is_active: true })
                .eq('id', volunteer.user_id);

            // The account was created with email_confirm:false (see the
            // create-pending-account Edge Function) so no confirmation email
            // was sent at registration time — trigger it now, on approval.
            // This runs on every approval (including re-approval after being
            // set back to pending), so it resends each time too.
            await supabaseClient.auth.resend({
                type: 'signup',
                email: volunteer.profiles?.email,
                options: { emailRedirectTo: 'https://wweilianggg.github.io/tinybloom-website/login.html' }
            });

            showToast('Volunteer approved and email sent!', 'success');
            closeDetailsModal();
            await loadRequests();

            await supabaseClient
                .from('email_notifications')
                .insert({
                    recipient_email: volunteer.profiles?.email,
                    recipient_name: volunteer.profiles?.full_name,
                    subject: 'TinyBloom Volunteer Account Approved',
                    message:
                        'Hi ' + volunteer.profiles?.full_name + ',\n\n' +
                        'Your TinyBloom volunteer account has been approved.\n\n' +
                        'You may now log in and start using your volunteer dashboard.\n\n' +
                        'Login here: http://127.0.0.1:5500/login.html\n\n' +
                        'Thank you,\nTinyBloom Team'
                });
        }

        async function rejectRequest(id) {
            if (!confirm('Reject this volunteer application?')) return;

            const { error } = await supabaseClient
                .from('volunteer_profiles')
                .update({
                    approval_status: 'rejected',
                    is_verified: false,
                    verified_at: null
                })
                .eq('id', id);

            if (error) {
                showToast(error.message, 'error');
                return;
            }

            showToast('Volunteer application rejected.', 'success');
            closeDetailsModal();
            await loadRequests();
        }

        async function deleteRequest(id) {
            if (!confirm('Permanently delete this volunteer application? This cannot be undone.')) return;

            const { data: volunteer, error: fetchError } = await supabaseClient
                .from('volunteer_profiles')
                .select('id, user_id')
                .eq('id', id)
                .single();

            if (fetchError) {
                showToast(fetchError.message, 'error');
                return;
            }

            const { error: deleteVolunteerError } = await supabaseClient
                .from('volunteer_profiles')
                .delete()
                .eq('id', id);

            if (deleteVolunteerError) {
                showToast(deleteVolunteerError.message, 'error');
                return;
            }

            const { error: deleteProfileError } = await supabaseClient
                .from('profiles')
                .delete()
                .eq('id', volunteer.user_id);

            if (deleteProfileError) {
                showToast(deleteProfileError.message, 'error');
                return;
            }

            showToast('Volunteer application deleted.', 'success');
            closeDetailsModal();
            await loadRequests();
        }

    </script>
</body>

</html>

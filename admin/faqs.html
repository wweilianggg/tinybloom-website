<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage FAQs — Admin</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="admin-layout">
  <div id="admin-sidebar-placeholder"></div>
  <div class="admin-content">
    <div class="admin-header">
      <h1>FAQ Management</h1>
      <button class="btn btn-primary" onclick="openFaqForm()">+ New FAQ</button>
    </div>

    <!-- FAQ Form -->
    <div id="faq-form-panel" style="display:none" class="card" style="margin-bottom:1.5rem">
      <h2 style="font-family:'Playfair Display',serif;font-size:1.2rem;margin-bottom:1.25rem" id="faq-form-title">New FAQ</h2>
      <input type="hidden" id="faq-id" />
      <div class="form-row">
        <div class="form-group">
          <label>Category</label>
          <select id="faq-category">
            <option value="General">General</option>
            <option value="Subscriptions">Subscriptions</option>
            <option value="Features">Features</option>
            <option value="Privacy">Privacy</option>
            <option value="Technical">Technical</option>
          </select>
        </div>
        <div class="form-group">
          <label>Display Order</label>
          <input type="number" id="faq-order" value="0" min="0" />
        </div>
      </div>
      <div class="form-group">
        <label>Question *</label>
        <input type="text" id="faq-question" placeholder="Enter the question" />
      </div>
      <div class="form-group">
        <label>Answer *</label>
        <textarea id="faq-answer" rows="4" placeholder="Enter the answer..." style="resize:vertical"></textarea>
      </div>
      <div class="form-group" style="display:flex;align-items:center;gap:0.5rem">
        <input type="checkbox" id="faq-published" checked style="width:auto" />
        <label for="faq-published" style="display:inline;margin:0;font-size:0.88rem">Published (visible on site)</label>
      </div>
      <div style="color:#e05c5c;font-size:0.82rem;margin-bottom:0.75rem;display:none" id="faq-error"></div>
      <div style="display:flex;gap:0.75rem">
        <button class="btn btn-primary" onclick="saveFaq()">Save FAQ</button>
        <button class="btn btn-ghost" onclick="closeFaqForm()">Cancel</button>
      </div>
    </div>

    <div id="faqs-container"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/app.js"></script>
<script>
let editingFaqId = null;

document.addEventListener('DOMContentLoaded', async () => {
  await requireAdmin();
  loadFaqs();
});

function openFaqForm(faq = null) {
  const panel = document.getElementById('faq-form-panel');
  panel.style.display = 'block';
  panel.scrollIntoView({ behavior: 'smooth' });
  editingFaqId = null;
  if (faq) {
    editingFaqId = faq.id;
    document.getElementById('faq-form-title').textContent = 'Edit FAQ';
    document.getElementById('faq-id').value = faq.id;
    document.getElementById('faq-question').value = faq.question || '';
    document.getElementById('faq-answer').value = faq.answer || '';
    document.getElementById('faq-category').value = faq.category || 'General';
    document.getElementById('faq-order').value = faq.display_order || 0;
    document.getElementById('faq-published').checked = faq.is_published ?? true;
  } else {
    document.getElementById('faq-form-title').textContent = 'New FAQ';
    document.getElementById('faq-id').value = '';
    document.getElementById('faq-question').value = '';
    document.getElementById('faq-answer').value = '';
    document.getElementById('faq-order').value = 0;
    document.getElementById('faq-published').checked = true;
  }
}
function closeFaqForm() { document.getElementById('faq-form-panel').style.display = 'none'; editingFaqId = null; }

async function saveFaq() {
  const errEl = document.getElementById('faq-error');
  errEl.style.display = 'none';
  const question = document.getElementById('faq-question').value.trim();
  const answer = document.getElementById('faq-answer').value.trim();
  if (!question || !answer) { errEl.textContent = 'Question and answer are required.'; errEl.style.display = 'block'; return; }

  const payload = {
    question, answer,
    category: document.getElementById('faq-category').value,
    display_order: parseInt(document.getElementById('faq-order').value) || 0,
    is_published: document.getElementById('faq-published').checked,
  };

  const { error } = editingFaqId
    ? await supabaseClient.from('faqs').update(payload).eq('id', editingFaqId)
    : await supabaseClient.from('faqs').insert(payload);

  if (error) { errEl.textContent = error.message; errEl.style.display = 'block'; return; }
  showToast('FAQ saved!', 'success');
  closeFaqForm();
  loadFaqs();
}

async function loadFaqs() {
  const container = document.getElementById('faqs-container');
  container.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--text-light)">Loading...</div>';
  const { data, error } = await supabaseClient.from('faqs').select('*').order('category').order('display_order');

  if (error) { container.innerHTML = `<div style="color:#c0392b;padding:2rem">Error: ${error.message}</div>`; return; }
  if (!data?.length) { container.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--text-light)">No FAQs yet. Click "+ New FAQ" to add one.</div>'; return; }

  const grouped = data.reduce((acc, f) => { const c = f.category||'General'; (acc[c]=acc[c]||[]).push(f); return acc; }, {});

  container.innerHTML = Object.entries(grouped).map(([cat, faqs]) => `
    <div style="margin-bottom:2rem">
      <h2 style="font-family:'Playfair Display',serif;font-size:1.1rem;margin-bottom:1rem;padding-bottom:0.5rem;border-bottom:2px solid var(--blush)">${cat}</h2>
      <div class="card" style="padding:0;overflow:hidden">
        <table>
          <thead><tr><th>Question</th><th>Status</th><th>Order</th><th>Actions</th></tr></thead>
          <tbody>
            ${faqs.map(f => `
              <tr>
                <td style="max-width:400px">
                  <div style="font-weight:600;font-size:0.88rem">${f.question}</div>
                  <div style="font-size:0.78rem;color:var(--text-light);margin-top:0.2rem">${f.answer.substring(0,80)}...</div>
                </td>
                <td><span class="badge ${f.is_published?'badge-green':'badge-gray'}">${f.is_published?'Published':'Hidden'}</span></td>
                <td>${f.display_order}</td>
                <td><div style="display:flex;gap:0.4rem">
                  <button class="btn btn-ghost btn-sm" onclick='openFaqForm(${JSON.stringify(f).replace(/'/g,"&#39;")})'>Edit</button>
                  <button class="btn btn-ghost btn-sm" style="color:#c0392b" onclick="deleteFaq('${f.id}')">Delete</button>
                </div></td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>`).join('');
}

async function deleteFaq(id) {
  if (!confirm('Delete this FAQ?')) return;
  await supabaseClient.from('faqs').delete().eq('id', id);
  showToast('FAQ deleted.');
  loadFaqs();
}
</script>
</body>
</html>

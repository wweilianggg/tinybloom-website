<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Download Page — Admin</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="admin-layout">
  <div id="admin-sidebar-placeholder"></div>
  <div class="admin-content">
    <div class="admin-header">
      <div>
        <h1>📲 Download Page</h1>
        <div style="font-size:0.85rem;color:var(--text-light);margin-top:0.25rem">Edit where the download button on the post-signup page sends users.</div>
      </div>
      <div style="display:flex;gap:0.75rem">
        <a href="../download.html" target="_blank" class="btn btn-outline btn-sm">↗ View Page</a>
        <button class="btn btn-primary" onclick="saveAll()" id="save-btn">Save Changes</button>
      </div>
    </div>
    <div class="form-success" id="save-ok" style="display:none;margin-bottom:1rem;text-align:center">✓ All changes saved!</div>

    <!-- Download CTA -->
    <div class="card" style="margin-bottom:1.5rem">
      <h2 style="font-family:'Playfair Display',serif;font-size:1.1rem;margin-bottom:1.25rem">Download Button</h2>
      <div class="form-group"><label>App Store / Download URL</label><input type="url" id="s-download_app_url" placeholder="https://tinybloom.app/download" /></div>
    </div>

    <div style="text-align:right;margin-bottom:2rem">
      <button class="btn btn-primary btn-lg" onclick="saveAll()">Save All Changes</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/app.js"></script>
<script>
const TEXT_KEYS = ['download_app_url'];

document.addEventListener('DOMContentLoaded', async () => {
  await requireAdmin();
  const { data } = await supabaseClient.from('site_settings').select('*');
  if (!data) return;
  data.forEach(s => {
    const el = document.getElementById('s-' + s.setting_key);
    if (el) el.value = s.setting_value || '';
  });
});

async function saveAll() {
  const btn = document.getElementById('save-btn');
  btn.textContent = 'Saving...'; btn.disabled = true;
  try {
    for (const key of TEXT_KEYS) {
      const el = document.getElementById('s-' + key); if (!el) continue;
      await supabaseClient.from('site_settings').upsert(
        { setting_key: key, setting_value: el.value.trim(), updated_at: new Date().toISOString() },
        { onConflict: 'setting_key' }
      );
    }
    document.getElementById('save-ok').style.display = 'block';
    setTimeout(() => document.getElementById('save-ok').style.display = 'none', 3000);
    showToast('All changes saved!', 'success');
  } catch (e) { showToast('Error: ' + e.message, 'error'); }
  finally { btn.textContent = 'Save Changes'; btn.disabled = false; }
}
</script>
</body>
</html>

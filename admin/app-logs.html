<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logs — Admin</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="admin-layout">
  <div id="admin-sidebar-placeholder"></div>
  <div class="admin-content">
    <div class="admin-header" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;flex-wrap:wrap;gap:1rem">
      <div>
        <h1 style="margin:0">📔 Logs</h1>
        <div style="font-size:0.85rem;color:var(--text-light);margin-top:0.25rem">Manage the mood, symptom and baby milestone options shown in the app's log tracker, and the tags specialists can attach to Learn articles.</div>
      </div>
      <select id="mode-select" onchange="onModeChange()" style="padding:0.6rem 0.9rem;border-radius:999px;border:1px solid rgba(92,79,74,0.12);background:white;min-width:140px;font-family:'DM Sans',sans-serif;font-size:0.88rem">
        <option value="logs">Logs</option>
        <option value="learn">Learn</option>
      </select>
    </div>

    <div id="category-tabs" style="display:flex;gap:0.6rem;margin-bottom:1.5rem;flex-wrap:wrap">
      <button class="btn btn-sm" id="tab-mood" onclick="setCategory('mood')">😊 Mood</button>
      <button class="btn btn-sm" id="tab-symptoms" onclick="setCategory('symptoms')">🤒 Symptoms</button>
      <button class="btn btn-sm" id="tab-milestones" onclick="setCategory('milestones')">👶 Baby Milestones</button>
    </div>

    <div class="admin-header" style="margin-bottom:1.25rem">
      <h2 id="category-title" style="font-family:'Playfair Display',serif;font-size:1.15rem;margin:0"></h2>
      <button class="btn btn-primary" id="new-item-btn" onclick="openItemForm()">+ New Tag</button>
    </div>

    <div id="item-form-panel" style="display:none" class="card" style="margin-bottom:1.5rem">
      <h2 style="font-family:'Playfair Display',serif;font-size:1.2rem;margin-bottom:1.25rem" id="item-form-title">New Tag</h2>
      <input type="hidden" id="item-id" />
      <div class="form-group"><label>Label *</label><input type="text" id="item-label" placeholder="e.g. Happy" /></div>
      <div style="color:#e05c5c;font-size:0.82rem;margin-bottom:0.75rem;display:none" id="item-error"></div>
      <div style="display:flex;gap:0.75rem"><button class="btn btn-primary" onclick="saveItem()">Save</button><button class="btn btn-ghost" onclick="closeItemForm()">Cancel</button></div>
    </div>
    <div id="items-container"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/app.js"></script>
<script>
// Mood/Symptoms/Baby Milestones all live in one table (pregnancy_log_options),
// distinguished by the `category` column. Learn tags are a separate table.
// Neither table has an is_active flag — deleting a row is how an option is
// removed, matching the schema the Flutter app already reads from.
const TABLE_BY_CATEGORY = {
  mood: 'pregnancy_log_options',
  symptoms: 'pregnancy_log_options',
  milestones: 'pregnancy_log_options',
  learn: 'learn_tags'
};
const DB_CATEGORY_VALUE = {
  mood: 'mood',
  symptoms: 'symptom',
  milestones: 'milestone'
};
const LABEL_BY_CATEGORY = {
  mood: 'Mood Options',
  symptoms: 'Symptom Options',
  milestones: 'Baby Milestone Options',
  learn: 'Learn Tags'
};
const SINGULAR_BY_CATEGORY = {
  mood: 'Mood Option',
  symptoms: 'Symptom Option',
  milestones: 'Baby Milestone Option',
  learn: 'Learn Tag'
};

let activeCategory = 'mood';
let editingItemId = null;
let currentItems = [];

document.addEventListener('DOMContentLoaded', async () => {
  await requireAdmin();
  setCategory('mood');
});

function onModeChange() {
  const mode = document.getElementById('mode-select').value;
  if (mode === 'learn') {
    document.getElementById('category-tabs').style.display = 'none';
    setCategory('learn');
  } else {
    document.getElementById('category-tabs').style.display = 'flex';
    setCategory('mood');
  }
}

function setCategory(category) {
  activeCategory = category;
  closeItemForm();
  ['mood', 'symptoms', 'milestones'].forEach(c => {
    const tab = document.getElementById(`tab-${c}`);
    if (tab) tab.className = `btn btn-sm ${c === category ? 'btn-primary' : 'btn-ghost'}`;
  });
  document.getElementById('category-title').textContent = LABEL_BY_CATEGORY[category];
  loadItems();
}

function openItemForm(item = null) {
  const panel = document.getElementById('item-form-panel');
  panel.style.display = 'block';
  panel.scrollIntoView({ behavior: 'smooth' });
  editingItemId = null;
  const singular = SINGULAR_BY_CATEGORY[activeCategory];
  if (item) {
    editingItemId = item.id;
    document.getElementById('item-form-title').textContent = `Edit ${singular}`;
    document.getElementById('item-id').value = item.id;
    document.getElementById('item-label').value = item.label || '';
  } else {
    document.getElementById('item-form-title').textContent = `New ${singular}`;
    document.getElementById('item-id').value = '';
    document.getElementById('item-label').value = '';
  }
}

function closeItemForm() {
  document.getElementById('item-form-panel').style.display = 'none';
  editingItemId = null;
}

async function saveItem() {
  const errEl = document.getElementById('item-error');
  errEl.style.display = 'none';
  const label = document.getElementById('item-label').value.trim();
  if (!label) { errEl.textContent = 'Label is required.'; errEl.style.display = 'block'; return; }
  const payload = { label };
  if (!editingItemId) {
    const maxOrder = currentItems.reduce((max, i) => Math.max(max, i.sort_order || 0), 0);
    payload.sort_order = maxOrder + 1;
  }
  const dbCategory = DB_CATEGORY_VALUE[activeCategory];
  if (dbCategory) payload.category = dbCategory;
  const table = TABLE_BY_CATEGORY[activeCategory];
  const { error } = editingItemId
    ? await supabaseClient.from(table).update(payload).eq('id', editingItemId)
    : await supabaseClient.from(table).insert(payload);
  if (error) { errEl.textContent = error.message; errEl.style.display = 'block'; return; }
  showToast('Saved!', 'success');
  closeItemForm();
  loadItems();
}

async function loadItems() {
  const container = document.getElementById('items-container');
  container.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--text-light)">Loading...</div>';
  const table = TABLE_BY_CATEGORY[activeCategory];
  const dbCategory = DB_CATEGORY_VALUE[activeCategory];
  let query = supabaseClient.from(table).select('*');
  if (dbCategory) query = query.eq('category', dbCategory);
  const { data, error } = await query.order('sort_order').order('label');
  if (error) { container.innerHTML = `<div style="color:#c0392b;padding:2rem">Error: ${escapeHtml(error.message)}</div>`; return; }
  currentItems = data || [];
  if (!data?.length) { container.innerHTML = `<div style="text-align:center;padding:2rem;color:var(--text-light)">No ${escapeHtml(LABEL_BY_CATEGORY[activeCategory].toLowerCase())} yet.</div>`; return; }
  container.innerHTML = `<div class="card" style="padding:0;overflow:hidden"><table><thead><tr><th style="width:3rem">#</th><th>Label</th><th>Actions</th></tr></thead><tbody>${data.map((i, idx) => `<tr><td style="font-size:0.88rem;color:var(--text-light)">${idx + 1}</td><td style="font-weight:600;font-size:0.88rem">${escapeHtml(i.label)}</td><td><div style="display:flex;gap:0.4rem"><button class="btn btn-ghost btn-sm" onclick='openItemForm(${JSON.stringify(i).replace(/'/g, "&#39;")})'>Edit</button><button class="btn btn-ghost btn-sm" style="color:#c0392b" onclick="deleteItem('${escapeJsString(i.id)}')">Delete</button></div></td></tr>`).join('')}</tbody></table></div>`;
}

async function deleteItem(id) {
  if (!confirm('Delete?')) return;
  const table = TABLE_BY_CATEGORY[activeCategory];
  await supabaseClient.from(table).delete().eq('id', id);
  showToast('Deleted.');
  loadItems();
}
</script>
</body>
</html>

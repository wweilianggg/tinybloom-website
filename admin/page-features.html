<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Features Page — Admin</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .feat-card-item { background:var(--blush); border-radius:var(--radius-sm); padding:1.25rem; margin-bottom:1.25rem; border-left:4px solid var(--rose); position:relative; }
    .feat-card-item:nth-child(even) { background:var(--teal-light); border-left-color:var(--teal); }
    .feat-card-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; }
    .feat-card-label { font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:var(--rose-deep); }
    .feat-card-item:nth-child(even) .feat-card-label { color:var(--teal); }
    .drag-hint { font-size:0.75rem;color:var(--text-light);font-style:italic }
  </style>
</head>
<body>
<div class="admin-layout">
  <div id="admin-sidebar-placeholder"></div>
  <div class="admin-content">
    <div class="admin-header">
      <div>
        <h1>✨ Features Page</h1>
        <div style="font-size:0.85rem;color:var(--text-light);margin-top:0.25rem">Edit all content on the Features page. Add or remove cards as needed.</div>
      </div>
      <div style="display:flex;gap:0.75rem">
        <a href="../features.html" target="_blank" class="btn btn-outline btn-sm">↗ View Page</a>
      </div>
    </div>
    <div class="form-success" id="save-ok" style="display:none;margin-bottom:1rem;text-align:center">✓ All changes saved!</div>

    <!-- Page Header -->
    <div class="card" style="margin-bottom:1.5rem">
      <h2 style="font-family:'Playfair Display',serif;font-size:1.1rem;margin-bottom:1.25rem">Page Header</h2>
      <div class="form-row">
        <div class="form-group"><label>Title</label><input type="text" id="feat_page_title" placeholder="Everything You Need" /></div>
        <div class="form-group"><label>Subtitle</label><input type="text" id="feat_page_subtitle" /></div>
      </div>
    </div>

    <!-- Feature Cards -->
    <div class="card" style="margin-bottom:1.5rem">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem">
        <div>
          <h2 style="font-family:'Playfair Display',serif;font-size:1.1rem;margin-bottom:0.2rem">Feature Cards</h2>
          <div class="drag-hint">Cards appear in order on the Features page</div>
        </div>
        <button class="btn btn-teal btn-sm" onclick="addCard()">+ Add Card</button>
      </div>

      <div id="cards-container">
        <!-- Cards rendered by JS -->
        <div style="text-align:center;padding:2rem;color:var(--text-light)">Loading cards...</div>
      </div>
    </div>

    <!-- CTA Section -->
    <div class="card" style="margin-bottom:1.5rem">
      <h2 style="font-family:'Playfair Display',serif;font-size:1.1rem;margin-bottom:1.25rem">CTA Section (bottom of Features page)</h2>
      <div class="form-row">
        <div class="form-group"><label>Title</label><input type="text" id="feat_cta_title" placeholder="Ready to get started?" /></div>
        <div class="form-group"><label>Subtitle</label><input type="text" id="feat_cta_subtitle" /></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Button 1 Text</label><input type="text" id="feat_cta_btn1" placeholder="Create Free Account" /></div>
        <div class="form-group"><label>Button 2 Text</label><input type="text" id="feat_cta_btn2" placeholder="View Pricing" /></div>
      </div>
    </div>

    <div style="text-align:right;margin-bottom:2rem">
      <button class="btn btn-primary btn-lg" onclick="saveAll()" id="save-btn">Save All Changes</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/app.js"></script>
<script>
let cardCount = 0;
let settings = {};

const HEADER_KEYS = ['feat_page_title','feat_page_subtitle','feat_cta_title','feat_cta_subtitle','feat_cta_btn1','feat_cta_btn2'];

const BADGE_SUGGESTIONS = [
  '✓ Free & Premium', '⭐ Premium Feature', '⭐ Premium Feature (Video)',
  '✓ Free for All', '✓ All Account Types', '⭐ Full Library (Premium)'
];

// Default text shown when a setting hasn't been saved yet, matching features.html.
const DEFAULT_HEADER = {
  feat_page_title: 'Everything You Need',
  feat_page_subtitle: 'Discover all the tools and features TinyBloom offers to support you through every step of your pregnancy.',
  feat_cta_title: 'Ready to get started?',
  feat_cta_subtitle: "Join TinyBloom free today. Upgrade when you're ready.",
  feat_cta_btn1: 'Create Free Account',
  feat_cta_btn2: 'View Pricing',
};

// Default title/description/badge/icon for each of the 9 built-in cards.
const DEFAULT_FEATURES = [
  { icon: '👶', title: 'Baby Monitor', desc: 'Track your baby’s kicks, movements, and heartbeat patterns in real-time. Get alerts for unusual activity and share reports with your doctor instantly.', badge: '✓ Free & Premium' },
  { icon: '📊', title: 'Health Tracker', desc: 'Monitor your weight, blood pressure, symptoms, and appointment reminders all in one place. Keep a complete pregnancy health journal with visual trends.', badge: '✓ Free for All' },
  { icon: '👩‍⚕️', title: 'Expert Consultation', desc: 'Chat with volunteer doctors and specialists for free advice. Upgrade to premium for one-on-one video consultations and personalised care from verified specialists.', badge: '⭐ Premium Feature (Specialist)' },
  { icon: '🤖', title: 'AI Pregnancy Chatbot', desc: 'Ask pregnancy-related questions anytime and receive instant guidance on symptoms, baby development, nutrition and general pregnancy concerns through an AI-powered assistant.', badge: '✓ Free for All' },
  { icon: '🎯', title: 'AI Recommendations', desc: 'Get personalised weekly tips, nutrition advice and health guidelines based on your trimester, health profile and specific needs. Powered by advanced AI.', badge: '⭐ Premium Feature' },
  { icon: '📚', title: 'Educational Library', desc: 'Access pregnancy articles, FAQs and expert-guided educational resources. Premium users enjoy the full education library, videos and advanced learning content.', badge: '✓ Free for All' },
  { icon: '📅', title: 'Appointment Reminders', desc: 'Never miss a prenatal check-up. Set reminders for scans, blood tests and doctor visits. Sync with your calendar and share with your next of kin.', badge: '✓ Free for All' },
  { icon: '💑', title: 'Family Portal', desc: 'Invite your partner or next of kin to stay updated on pregnancy milestones, appointments and health summaries, keeping your support network connected.', badge: '✓ Free for All' },
  { icon: '📰', title: 'Pregnancy Articles & FAQ', desc: 'Browse our curated library of articles and frequently asked questions written by medical experts. From first trimester to postpartum care.', badge: '✓ Free for All' },
];

document.addEventListener('DOMContentLoaded', async () => {
  await requireAdmin();
  await loadAll();
});

// Loads saved settings and renders the header fields plus one box per feature card.
async function loadAll() {
  const { data } = await supabaseClient.from('site_settings').select('*');
  if (!data) return;

  data.forEach(s => { settings[s.setting_key] = s.setting_value || ''; });

  // Fill header fields
  HEADER_KEYS.forEach(key => {
    const el = document.getElementById(key);
    if (el) el.value = settings[key] || DEFAULT_HEADER[key] || '';
  });

  // Determine card count
  cardCount = parseInt(settings['feat_card_count'] || '8');
  renderCards();
}

// Rebuilds the whole card list from scratch (used after load, add, or remove).
function renderCards() {
  const container = document.getElementById('cards-container');
  container.innerHTML = '';
  for (let i = 1; i <= cardCount; i++) {
    container.appendChild(buildCardEl(i));
  }
}

// Builds the editable form box for one feature card.
function buildCardEl(n, useDefaults = true) {
  const div = document.createElement('div');
  div.className = 'feat-card-item';
  div.id = 'feat-card-' + n;

  // useDefaults=false keeps cards added via "+ Add Card" blank, even if
  // their index matches one of the 9 built-in defaults.
  const def = useDefaults ? (DEFAULT_FEATURES[n - 1] || {}) : {};
  const title = settings['feat_card' + n + '_title'] || def.title || '';
  const desc = settings['feat_card' + n + '_desc'] || def.desc || '';
  const badge = settings['feat_card' + n + '_badge'] || def.badge || '';
  const icon = settings['feat_card' + n + '_icon'] || def.icon || '';

  div.innerHTML = `
    <div class="feat-card-header">
      <span class="feat-card-label">Card ${n}</span>
      <button class="btn btn-ghost btn-sm" style="color:#c0392b;font-size:0.78rem" onclick="removeCard(${n})">✕ Remove</button>
    </div>
    <div class="form-row">
      <div class="form-group" style="flex:0 0 90px">
        <label>Icon</label>
        <input type="text" id="card${n}_icon" value="${escHtml(icon)}" placeholder="👶" />
      </div>
      <div class="form-group" style="flex:1">
        <label>Title</label>
        <input type="text" id="card${n}_title" value="${escHtml(title)}" placeholder="e.g. Baby Monitor" />
      </div>
      <div class="form-group" style="flex:1">
        <label>Access Badge</label>
        <input type="text" id="card${n}_badge" value="${escHtml(badge)}" placeholder="e.g. ✓ Free &amp; Premium" list="badge-suggestions" />
      </div>
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea id="card${n}_desc" rows="3" style="resize:vertical" placeholder="Describe this feature...">${escHtml(desc)}</textarea>
    </div>`;

  return div;
}

// Escapes text so it's safe to insert as HTML.
function escHtml(str) {
  return (str || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Adds a new blank card at the end of the list.
function addCard() {
  cardCount++;
  settings['feat_card' + cardCount + '_title'] = '';
  settings['feat_card' + cardCount + '_desc'] = '';
  settings['feat_card' + cardCount + '_badge'] = '';
  settings['feat_card' + cardCount + '_icon'] = '';
  const container = document.getElementById('cards-container');
  container.appendChild(buildCardEl(cardCount, false));
  document.getElementById('feat-card-' + cardCount).scrollIntoView({ behavior: 'smooth' });
  showToast('Card ' + cardCount + ' added!', 'success');
}

// Removes one card and shifts all the cards after it up by one position.
async function removeCard(n) {
  if (cardCount <= 1) { showToast('Must have at least 1 card.', 'error'); return; }
  if (!await showConfirm(`Remove Card ${n}? This will shift all cards below it up by one.`, { title: 'Remove Card', confirmLabel: 'Remove' })) return;

  // Shift all cards after n down by 1
  for (let i = n; i < cardCount; i++) {
    settings['feat_card' + i + '_title'] = document.getElementById('card' + (i+1) + '_title')?.value || settings['feat_card' + (i+1) + '_title'] || '';
    settings['feat_card' + i + '_desc'] = document.getElementById('card' + (i+1) + '_desc')?.value || settings['feat_card' + (i+1) + '_desc'] || '';
    settings['feat_card' + i + '_badge'] = document.getElementById('card' + (i+1) + '_badge')?.value || settings['feat_card' + (i+1) + '_badge'] || '';
    settings['feat_card' + i + '_icon'] = document.getElementById('card' + (i+1) + '_icon')?.value || settings['feat_card' + (i+1) + '_icon'] || '';
  }

  // Clear the last card's data from DB
  await supabaseClient.from('site_settings').delete().eq('setting_key', 'feat_card' + cardCount + '_title');
  await supabaseClient.from('site_settings').delete().eq('setting_key', 'feat_card' + cardCount + '_desc');
  await supabaseClient.from('site_settings').delete().eq('setting_key', 'feat_card' + cardCount + '_badge');
  await supabaseClient.from('site_settings').delete().eq('setting_key', 'feat_card' + cardCount + '_icon');

  cardCount--;
  renderCards();
  showToast('Card removed.', '');
}

// Saves the header fields, card count, and every card's fields to site_settings.
async function saveAll() {
  const btn = document.getElementById('save-btn');
  btn.textContent = 'Saving...'; btn.disabled = true;

  try {
    // Save header fields
    for (const key of HEADER_KEYS) {
      const el = document.getElementById(key); if (!el) continue;
      await supabaseClient.from('site_settings').upsert(
        { setting_key: key, setting_value: el.value.trim(), updated_at: new Date().toISOString() },
        { onConflict: 'setting_key' }
      );
    }

    // Save card count
    await supabaseClient.from('site_settings').upsert(
      { setting_key: 'feat_card_count', setting_value: String(cardCount), updated_at: new Date().toISOString() },
      { onConflict: 'setting_key' }
    );

    // Save each card's fields
    for (let i = 1; i <= cardCount; i++) {
      const titleEl = document.getElementById('card' + i + '_title');
      const descEl  = document.getElementById('card' + i + '_desc');
      const badgeEl = document.getElementById('card' + i + '_badge');

      await supabaseClient.from('site_settings').upsert({ setting_key: 'feat_card' + i + '_title', setting_value: titleEl?.value.trim() || '', updated_at: new Date().toISOString() }, { onConflict: 'setting_key' });
      await supabaseClient.from('site_settings').upsert({ setting_key: 'feat_card' + i + '_desc',  setting_value: descEl?.value.trim()  || '', updated_at: new Date().toISOString() }, { onConflict: 'setting_key' });
      await supabaseClient.from('site_settings').upsert({ setting_key: 'feat_card' + i + '_badge', setting_value: badgeEl?.value.trim() || '', updated_at: new Date().toISOString() }, { onConflict: 'setting_key' });
    }

    document.getElementById('save-ok').style.display = 'block';
    setTimeout(() => document.getElementById('save-ok').style.display = 'none', 3000);
    showToast('All changes saved!', 'success');

  } catch (e) {
    showToast('Error: ' + e.message, 'error');
  } finally {
    btn.textContent = 'Save All Changes'; btn.disabled = false;
  }
}
</script>

<!-- Badge autocomplete suggestions -->
<datalist id="badge-suggestions">
  <option value="✓ Free & Premium">
  <option value="⭐ Premium Feature">
  <option value="⭐ Premium Feature (Video)">
  <option value="✓ Free for All">
  <option value="✓ All Account Types">
  <option value="⭐ Full Library (Premium)">
</datalist>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Page — Admin</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="admin-layout">
  <div id="admin-sidebar-placeholder"></div>
  <div class="admin-content">
    <div class="admin-header">
      <div><h1>💳 Payment Page</h1><div style="font-size:0.85rem;color:var(--text-light);margin-top:0.25rem">Edit text shown on the Plans &amp; Pricing page.</div></div>
      <div style="display:flex;gap:0.75rem">
        <a href="../payment.html" target="_blank" class="btn btn-outline btn-sm">↗ View Page</a>
        <button class="btn btn-primary" onclick="saveAll()" id="save-btn">Save Changes</button>
      </div>
    </div>
    <div class="form-success" id="save-ok" style="display:none;margin-bottom:1rem;text-align:center">✓ Saved!</div>

    <div class="card" style="margin-bottom:1.5rem">
      <h2 style="font-family:'Playfair Display',serif;font-size:1.1rem;margin-bottom:1.25rem">Page Header</h2>
      <div class="form-row">
        <div class="form-group"><label>Title</label><input type="text" id="s-payment_title" placeholder="Get TinyBloom Premium" /></div>
        <div class="form-group"><label>Subtitle</label><input type="text" id="s-payment_subtitle" /></div>
      </div>
    </div>

    <div class="card" style="margin-bottom:1.5rem">
      <h2 style="font-family:'Playfair Display',serif;font-size:1.1rem;margin-bottom:1.25rem">Plan Card</h2>
      <div class="form-row">
        <div class="form-group"><label>Plan Name</label><input type="text" id="s-payment_plan_name" placeholder="Premium" /></div>
        <div class="form-group"><label>Plan Tagline</label><input type="text" id="s-payment_plan_tagline" /></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Billing Note (Monthly)</label><input type="text" id="s-payment_billing_note_monthly" placeholder="Billed monthly. Cancel anytime." /></div>
        <div class="form-group"><label>Billing Note (Yearly)</label><input type="text" id="s-payment_billing_note_yearly" placeholder="Billed annually. Cancel anytime." /></div>
      </div>
    </div>

    <div class="card" style="margin-bottom:1.5rem">
      <h2 style="font-family:'Playfair Display',serif;font-size:1.1rem;margin-bottom:1.25rem">Feature Bullet Points</h2>
      <p style="font-size:0.82rem;color:var(--text-light);margin-bottom:1.25rem">These 6 bullet points are shown on the plan card.</p>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
        <div class="form-group"><label>Bullet 1</label><input type="text" id="s-plan_bullet1" placeholder="Personalised pregnancy tracking" /></div>
        <div class="form-group"><label>Bullet 2</label><input type="text" id="s-plan_bullet2" placeholder="Advanced symptom tracking" /></div>
        <div class="form-group"><label>Bullet 3</label><input type="text" id="s-plan_bullet3" placeholder="AI-powered weekly tips" /></div>
        <div class="form-group"><label>Bullet 4</label><input type="text" id="s-plan_bullet4" placeholder="Video consultations" /></div>
        <div class="form-group"><label>Bullet 5</label><input type="text" id="s-plan_bullet5" placeholder="Baby development insights" /></div>
        <div class="form-group"><label>Bullet 6</label><input type="text" id="s-plan_bullet6" placeholder="Full education library" /></div>
      </div>
    </div>

    <div class="card" style="margin-bottom:1.5rem">
      <h2 style="font-family:'Playfair Display',serif;font-size:1.1rem;margin-bottom:1.25rem">Buttons</h2>
      <div class="form-row">
        <div class="form-group"><label>Continue Button Text</label><input type="text" id="s-payment_btn" placeholder="Continue to Payment →" /></div>
        <div class="form-group"><label>Back Button Text</label><input type="text" id="s-payment_back_btn" placeholder="← Back to Registration" /></div>
      </div>
    </div>

    <div style="text-align:right;margin-bottom:2rem">
      <button class="btn btn-primary btn-lg" onclick="saveAll()">Save All Changes</button>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="../js/admin-sidebar.js"></script>
<script>
const KEYS = [
  'payment_title','payment_subtitle','payment_plan_name','payment_plan_tagline',
  'payment_billing_note_monthly','payment_billing_note_yearly',
  'payment_btn','payment_back_btn',
  'plan_bullet1','plan_bullet2','plan_bullet3','plan_bullet4','plan_bullet5','plan_bullet6'
];

document.addEventListener('DOMContentLoaded', async () => {
  await requireAdmin();
  const { data } = await supabaseClient.from('site_settings').select('*');
  if (data) data.forEach(s => { const el = document.getElementById('s-' + s.setting_key); if (el) el.value = s.setting_value || ''; });
});

async function saveAll() {
  const btn = document.getElementById('save-btn'); btn.textContent = 'Saving...'; btn.disabled = true;
  try {
    for (const key of KEYS) {
      const el = document.getElementById('s-' + key); if (!el) continue;
      await supabaseClient.from('site_settings').upsert({ setting_key: key, setting_value: el.value.trim(), updated_at: new Date().toISOString() }, { onConflict: 'setting_key' });
    }
    document.getElementById('save-ok').style.display = 'block';
    setTimeout(() => document.getElementById('save-ok').style.display = 'none', 3000);
    showToast('Saved!', 'success');
  } catch (e) { showToast('Error: ' + e.message, 'error'); }
  finally { btn.textContent = 'Save Changes'; btn.disabled = false; }
}
</script>
</body>
</html>

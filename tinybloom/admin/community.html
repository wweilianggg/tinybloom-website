<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Community Moderation — Admin</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>


<div class="admin-layout">
  <div class="admin-sidebar">
    <h2>Admin Panel</h2>
    <ul class="admin-nav">
      <li><a href="index.html">📊 Dashboard</a></li>
      <li><a href="users.html">👥 Users</a></li>
      <li><a href="content.html">📝 Content</a></li>
      <li><a href="testimonials.html">⭐ Testimonials</a></li>
      <li><a href="faqs.html">❓ FAQs</a></li>
      
      <li><a href="community.html" class="active">🤝 Community</a></li>
      <li><a href="settings.html">⚙️ Settings</a></li>
      <li><a href="../index.html">← Back to Site</a></li>
    </ul>
  </div>

  <div class="admin-content">
    <div class="admin-header">
      <h1>Community Moderation</h1>
      <div style="display:flex;gap:0.75rem">
        <select id="post-filter" onchange="loadPosts()" style="padding:0.5rem 1rem;border-radius:50px;border:1.5px solid rgba(92,79,74,0.15);font-family:'DM Sans',sans-serif;font-size:0.88rem">
          <option value="">All Posts</option>
          <option value="true">Published</option>
          <option value="false">Hidden</option>
        </select>
      </div>
    </div>

    <div class="card" style="padding:0;overflow:hidden">
      <table>
        <thead>
          <tr>
            <th>Author</th>
            <th>Category</th>
            <th>Content Preview</th>
            <th>Likes</th>
            <th>Status</th>
            <th>Posted</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="posts-table">
          <tr><td colspan="7" style="text-align:center;padding:2rem;color:var(--text-light)">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="../js/admin-common.js"></script>

<script>
document.addEventListener('DOMContentLoaded', async () => {
  await requireAdmin();
  loadPosts();
});

async function loadPosts() {
  const tbody = document.getElementById('posts-table');
  tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:2rem;color:var(--text-light)">Loading...</td></tr>';

  const filter = document.getElementById('post-filter').value;
  let query = supabaseClient
    .from('community_posts')
    .select(`*, profiles(full_name)`)
    .order('created_at', { ascending: false });
  if (filter !== '') query = query.eq('is_published', filter === 'true');

  const { data } = await query;
  if (!data || !data.length) {
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:2rem;color:var(--text-light)">No posts found.</td></tr>';
    return;
  }

  tbody.innerHTML = data.map(p => `
    <tr id="post-row-${p.id}">
      <td>${p.is_anonymous ? '<em style="color:var(--text-light)">Anonymous</em>' : (p.profiles?.full_name || '—')}</td>
      <td>${p.category || '—'}</td>
      <td style="max-width:280px">
        ${p.title ? `<div style="font-weight:600;font-size:0.85rem">${p.title}</div>` : ''}
        <div style="font-size:0.8rem;color:var(--text-mid)">${p.content.substring(0, 100)}${p.content.length > 100 ? '...' : ''}</div>
      </td>
      <td>♥ ${p.like_count || 0}</td>
      <td><span class="badge ${p.is_published ? 'badge-green' : 'badge-rose'}">${p.is_published ? 'Visible' : 'Hidden'}</span></td>
      <td>${new Date(p.created_at).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}</td>
      <td>
        <div style="display:flex;gap:0.4rem">
          ${p.is_published
            ? `<button class="btn btn-ghost btn-sm" onclick="hidePost('${p.id}')">Hide</button>`
            : `<button class="btn btn-teal btn-sm" onclick="showPost('${p.id}')">Show</button>`}
          <button class="btn btn-ghost btn-sm" style="color:#c0392b" onclick="deletePost('${p.id}')">Delete</button>
        </div>
      </td>
    </tr>`).join('');
}

async function hidePost(id) {
  await supabaseClient.from('community_posts').update({ is_published: false }).eq('id', id);
  showToast('Post hidden.', '');
  loadPosts();
}
async function showPost(id) {
  await supabaseClient.from('community_posts').update({ is_published: true }).eq('id', id);
  showToast('Post published.', 'success');
  loadPosts();
}
async function deletePost(id) {
  if (!confirm('Permanently delete this post and all its comments?')) return;
  await supabaseClient.from('community_posts').delete().eq('id', id);
  document.getElementById('post-row-' + id)?.remove();
  showToast('Post deleted.', '');
}
</script>
</body>
</html>

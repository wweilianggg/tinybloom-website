<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Testimonials Page — Admin</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="admin-layout">
  <div id="admin-sidebar-placeholder"></div>
  <div class="admin-content">
    <div class="admin-header">
      <div><h1>⭐ Testimonials Page</h1><div style="font-size:0.85rem;color:var(--text-light);margin-top:0.25rem">Manage testimonials shown on the site.</div></div>
      <div style="display:flex;gap:0.75rem">
        <a href="../testimonials.html" target="_blank" class="btn btn-outline btn-sm">↗ Preview</a>
        <button class="btn btn-primary" onclick="openAddForm()">+ Add Testimonial</button>
      </div>
    </div>

    <!-- Add/Edit Form -->
    <div id="testimonial-form" class="card" style="display:none;margin-bottom:1.5rem">
      <h2 style="font-family:'Playfair Display',serif;font-size:1.1rem;margin-bottom:1.25rem" id="form-heading">Add Testimonial</h2>
      <input type="hidden" id="edit-id" />
      <div class="form-row">
        <div class="form-group"><label>Reviewer Name *</label><input type="text" id="t-name" placeholder="e.g. Sarah K." /></div>
        <div class="form-group"><label>Review Date *</label><input type="date" id="t-date" /></div>
      </div>
      <div class="form-group"><label>Review Content *</label><textarea id="t-content" rows="4" style="resize:vertical"></textarea></div>
      <div class="form-row">
        <div class="form-group"><label>Rating *</label>
          <select id="t-rating">
            <option value="5">★★★★★ (5)</option><option value="4">★★★★☆ (4)</option>
            <option value="3">★★★☆☆ (3)</option><option value="2">★★☆☆☆ (2)</option><option value="1">★☆☆☆☆ (1)</option>
          </select>
        </div>
        <div class="form-group"><label>Status</label>
          <select id="t-status"><option value="true">Published</option><option value="false">Pending</option></select>
        </div>
      </div>
      <div style="color:#e05c5c;font-size:0.82rem;margin-bottom:0.75rem;display:none" id="t-error"></div>
      <div style="display:flex;gap:0.75rem">
        <button class="btn btn-primary" onclick="saveTestimonial()">Save</button>
        <button class="btn btn-ghost" onclick="closeForm()">Cancel</button>
      </div>
    </div>

    <div style="display:flex;gap:0.75rem;margin-bottom:1.25rem">
      <select id="test-filter" onchange="loadTestimonials()" style="padding:0.5rem 1rem;border-radius:50px;border:1.5px solid rgba(92,79,74,0.15);font-family:'DM Sans',sans-serif;font-size:0.88rem">
        <option value="">All</option><option value="approved">Published</option><option value="pending">Pending</option>
      </select>
    </div>
    <div id="testimonials-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.25rem">
      <div style="text-align:center;padding:3rem;color:var(--text-light)">Loading...</div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="../js/admin-sidebar.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => { await requireAdmin(); document.getElementById('t-date').value = new Date().toISOString().split('T')[0]; loadTestimonials(); });
function openAddForm() { document.getElementById('edit-id').value=''; document.getElementById('form-heading').textContent='Add Testimonial'; document.getElementById('t-name').value=''; document.getElementById('t-content').value=''; document.getElementById('t-rating').value='5'; document.getElementById('t-status').value='true'; document.getElementById('t-date').value=new Date().toISOString().split('T')[0]; document.getElementById('t-error').style.display='none'; document.getElementById('testimonial-form').style.display='block'; document.getElementById('testimonial-form').scrollIntoView({behavior:'smooth'}); }
function openEditForm(t) { document.getElementById('edit-id').value=t.id; document.getElementById('form-heading').textContent='Edit Testimonial'; document.getElementById('t-name').value=t.reviewer_name; document.getElementById('t-content').value=t.content; document.getElementById('t-rating').value=String(t.rating); document.getElementById('t-status').value=String(t.is_published); document.getElementById('t-date').value=t.review_date; document.getElementById('t-error').style.display='none'; document.getElementById('testimonial-form').style.display='block'; document.getElementById('testimonial-form').scrollIntoView({behavior:'smooth'}); }
function closeForm() { document.getElementById('testimonial-form').style.display='none'; }
async function saveTestimonial() { const errEl=document.getElementById('t-error'); errEl.style.display='none'; const name=document.getElementById('t-name').value.trim(); const content=document.getElementById('t-content').value.trim(); const date=document.getElementById('t-date').value; const editId=document.getElementById('edit-id').value; if (!name||!content||!date) { errEl.textContent='Name, content and date required.'; errEl.style.display='block'; return; } const payload={reviewer_name:name,content,review_date:date,rating:parseInt(document.getElementById('t-rating').value),is_published:document.getElementById('t-status').value==='true'}; const {error}=editId ? await supabaseClient.from('testimonials').update(payload).eq('id',editId) : await supabaseClient.from('testimonials').insert(payload); if (error) { errEl.textContent=error.message; errEl.style.display='block'; return; } showToast(editId?'Updated!':'Added!','success'); closeForm(); loadTestimonials(); }
async function loadTestimonials() { const container=document.getElementById('testimonials-grid'); container.innerHTML='<div style="text-align:center;padding:3rem;color:var(--text-light)">Loading...</div>'; const filter=document.getElementById('test-filter').value; let query=supabaseClient.from('testimonials').select('*').order('review_date',{ascending:false}); if (filter==='pending') query=query.eq('is_published',false); if (filter==='approved') query=query.eq('is_published',true); const {data,error}=await query; if (error) { container.innerHTML=`<div style="color:#c0392b;padding:2rem;text-align:center">Error: ${error.message}</div>`; return; } if (!data?.length) { container.innerHTML='<div style="text-align:center;padding:3rem;color:var(--text-light)">No testimonials found.</div>'; return; } container.innerHTML=data.map(t=>`<div class="card" id="test-${t.id}" style="border-top:3px solid ${t.is_published?'var(--sage)':'var(--rose)'}"><div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:0.75rem"><div><div style="font-weight:700">${t.reviewer_name}</div><div style="font-size:0.78rem;color:var(--text-light)">${new Date(t.review_date).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}</div></div><span class="badge ${t.is_published?'badge-green':'badge-rose'}">${t.is_published?'Published':'Pending'}</span></div><div style="color:#f0b429;margin-bottom:0.75rem">${'★'.repeat(t.rating)}${'☆'.repeat(5-t.rating)}</div><p style="font-size:0.88rem;color:var(--text-mid);margin-bottom:1.25rem;line-height:1.6">${t.content}</p><div style="display:flex;gap:0.65rem;flex-wrap:wrap">${!t.is_published?`<button class="btn btn-teal btn-sm" onclick="togglePublish('${t.id}',true)">✓ Publish</button>`:`<button class="btn btn-ghost btn-sm" onclick="togglePublish('${t.id}',false)">Unpublish</button>`}<button class="btn btn-outline btn-sm" onclick='openEditForm(${JSON.stringify(t).replace(/'/g,"&#39;")})'>Edit</button><button class="btn btn-ghost btn-sm" style="color:#c0392b" onclick="deleteTestimonial('${t.id}')">Delete</button></div></div>`).join(''); }
async function togglePublish(id,publish) { await supabaseClient.from('testimonials').update({is_published:publish}).eq('id',id); showToast(publish?'Published!':'Unpublished.',publish?'success':''); loadTestimonials(); }
async function deleteTestimonial(id) { if (!confirm('Delete?')) return; await supabaseClient.from('testimonials').delete().eq('id',id); document.getElementById('test-'+id)?.remove(); showToast('Deleted.'); }
</script>
</body>
</html>

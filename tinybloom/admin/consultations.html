<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Consultations — Admin</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>


<div class="admin-layout">
  <div class="admin-sidebar">
    <h2>Admin Panel</h2>
    <ul class="admin-nav">
      <li><a href="index.html">📊 Dashboard</a></li>
      <li><a href="users.html">👥 Users</a></li>
      <li><a href="content.html">📝 Content</a></li>
      <li><a href="testimonials.html">⭐ Testimonials</a></li>
      <li><a href="faqs.html">❓ FAQs</a></li>
      <li><a href="consultations.html" class="active">👩‍⚕️ Consultations</a></li>
      
      <li><a href="settings.html">⚙️ Settings</a></li>
      <li><a href="../index.html">← Back to Site</a></li>
    </ul>
  </div>

  <div class="admin-content">
    <div class="admin-header">
      <h1>Consultations</h1>
      <select id="consult-filter" onchange="loadConsultations()" style="padding:0.5rem 1rem;border-radius:50px;border:1.5px solid rgba(92,79,74,0.15);font-family:'DM Sans',sans-serif;font-size:0.88rem">
        <option value="">All Status</option>
        <option value="pending">Pending</option>
        <option value="confirmed">Confirmed</option>
        <option value="completed">Completed</option>
        <option value="cancelled">Cancelled</option>
      </select>
    </div>

    <!-- Stats -->
    <div class="stats-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:2rem" id="consult-stats">
      <div class="stat-card"><div class="stat-label">Pending</div><div class="stat-value" id="cs-pending">—</div></div>
      <div class="stat-card"><div class="stat-label">Confirmed</div><div class="stat-value" id="cs-confirmed">—</div></div>
      <div class="stat-card"><div class="stat-label">Completed</div><div class="stat-value" id="cs-completed">—</div></div>
      <div class="stat-card"><div class="stat-label">Cancelled</div><div class="stat-value" id="cs-cancelled">—</div></div>
    </div>

    <div class="card" style="padding:0;overflow:hidden">
      <table>
        <thead>
          <tr>
            <th>Patient</th>
            <th>Specialist</th>
            <th>Type</th>
            <th>Scheduled</th>
            <th>Status</th>
            <th>Premium</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="consult-table">
          <tr><td colspan="7" style="text-align:center;padding:2rem;color:var(--text-light)">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="../js/admin-common.js"></script>

<script>
document.addEventListener('DOMContentLoaded', async () => {
  await requireAdmin();
  loadConsultations();
  loadConsultStats();
});

async function loadConsultStats() {
  const statuses = ['pending','confirmed','completed','cancelled'];
  for (const s of statuses) {
    const { count } = await supabaseClient.from('consultations').select('id', { count: 'exact' }).eq('status', s);
    document.getElementById('cs-' + s).textContent = count ?? 0;
  }
}

async function loadConsultations() {
  const tbody = document.getElementById('consult-table');
  tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:2rem;color:var(--text-light)">Loading...</td></tr>';

  const filter = document.getElementById('consult-filter').value;
  let query = supabaseClient.from('consultations')
    .select(`*, patient:profiles!consultations_patient_id_fkey(full_name), specialist:profiles!consultations_specialist_id_fkey(full_name)`)
    .order('created_at', { ascending: false });
  if (filter) query = query.eq('status', filter);

  const { data, error } = await query;

  if (error || !data || !data.length) {
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:2rem;color:var(--text-light)">No consultations found.</td></tr>';
    return;
  }

  const statusBadge = { pending:'badge-gold', confirmed:'badge-teal', completed:'badge-green', cancelled:'badge-rose' };
  tbody.innerHTML = data.map(c => `
    <tr>
      <td>${c.patient?.full_name || '—'}</td>
      <td>${c.specialist?.full_name || '<span style="color:var(--text-light)">Unassigned</span>'}</td>
      <td><span class="badge badge-teal">${c.consultation_type || 'chat'}</span></td>
      <td>${c.scheduled_at ? new Date(c.scheduled_at).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : '—'}</td>
      <td><span class="badge ${statusBadge[c.status] || 'badge-gray'}">${c.status}</span></td>
      <td>${c.is_premium ? '<span class="badge badge-gold">⭐</span>' : '—'}</td>
      <td>
        <select onchange="updateStatus('${c.id}', this.value)" style="padding:0.3rem 0.5rem;font-size:0.78rem;border-radius:6px;border:1px solid rgba(92,79,74,0.2)">
          <option value="">Change status</option>
          <option value="pending">Pending</option>
          <option value="confirmed">Confirmed</option>
          <option value="completed">Completed</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </td>
    </tr>`).join('');
}

async function updateStatus(id, status) {
  if (!status) return;
  await supabaseClient.from('consultations').update({ status }).eq('id', id);
  showToast('Status updated!', 'success');
  loadConsultations();
  loadConsultStats();
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subscriptions Page — Admin</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="admin-layout">
  <div id="admin-sidebar-placeholder"></div>
  <div class="admin-content">
    <div class="admin-header">
      <div><h1>💰 Subscriptions Page</h1><div style="font-size:0.85rem;color:var(--text-light);margin-top:0.25rem">Edit pricing, plan names and page text.</div></div>
      <div style="display:flex;gap:0.75rem">
        <a href="../subscriptions.html" target="_blank" class="btn btn-outline btn-sm">↗ Preview</a>
        <button class="btn btn-primary" onclick="saveAll()" id="save-btn">Save Changes</button>
      </div>
    </div>
    <div class="form-success" id="save-ok" style="display:none;margin-bottom:1rem;text-align:center">✓ Saved!</div>

    <div class="card" style="margin-bottom:1.5rem">
      <h2 style="font-family:'Playfair Display',serif;font-size:1.1rem;margin-bottom:1.25rem">Page Header</h2>
      <div class="form-row">
        <div class="form-group"><label>Title</label><input type="text" id="s-sub_page_title" placeholder="Simple Pricing" /></div>
        <div class="form-group"><label>Subtitle</label><input type="text" id="s-sub_page_subtitle" /></div>
      </div>
    </div>

    <div class="card" style="margin-bottom:1.5rem">
      <h2 style="font-family:'Playfair Display',serif;font-size:1.1rem;margin-bottom:1.25rem">Pricing</h2>
      <div style="background:var(--blush);border-radius:var(--radius-sm);padding:1rem;margin-bottom:1rem;font-size:0.82rem;color:var(--text-mid)">
        💡 Changing prices here updates the Subscriptions page, Home page pricing cards, and Payment page automatically.
      </div>
      <div class="form-row">
        <div class="form-group"><label>Monthly Premium Price (USD)</label><input type="number" id="s-premium_monthly_price" step="0.01" placeholder="9.90" /></div>
        <div class="form-group"><label>Yearly Premium Price (USD)</label><input type="number" id="s-premium_yearly_price" step="0.01" placeholder="90.00" /></div>
      </div>
    </div>

    <div class="card" style="margin-bottom:1.5rem">
      <h2 style="font-family:'Playfair Display',serif;font-size:1.1rem;margin-bottom:1.25rem">Plan Names &amp; Labels</h2>
      <div class="form-row">
        <div class="form-group"><label>Premium Plan Name</label><input type="text" id="s-sub_premium_name" placeholder="Premium" /></div>
        <div class="form-group"><label>Annual Plan Name</label><input type="text" id="s-sub_annual_name" placeholder="Premium Annual" /></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>"Most Popular" Badge Text</label><input type="text" id="s-sub_popular_badge" placeholder="Most Popular" /></div>
        <div class="form-group"><label>"Best Value" Badge Text</label><input type="text" id="s-sub_value_badge" placeholder="Best Value" /></div>
      </div>
      <div class="form-group"><label>Comparison Table Title</label><input type="text" id="s-sub_compare_title" placeholder="Full Feature Comparison" /></div>
    </div>
    <div style="text-align:right"><button class="btn btn-primary btn-lg" onclick="saveAll()">Save All Changes</button></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="../js/admin-sidebar.js"></script>
<script>
const KEYS = ['sub_page_title','sub_page_subtitle','premium_monthly_price','premium_yearly_price',
  'sub_premium_name','sub_annual_name','sub_popular_badge','sub_value_badge','sub_compare_title'];

document.addEventListener('DOMContentLoaded', async () => {
  await requireAdmin();
  const { data } = await supabaseClient.from('site_settings').select('*');
  if (data) data.forEach(s => { const el = document.getElementById('s-' + s.setting_key); if (el) el.value = s.setting_value || ''; });
});

async function saveAll() {
  const btn = document.getElementById('save-btn'); btn.textContent = 'Saving...'; btn.disabled = true;
  try {
    for (const key of KEYS) {
      const el = document.getElementById('s-' + key); if (!el) continue;
      await supabaseClient.from('site_settings').upsert({ setting_key: key, setting_value: el.value.trim(), updated_at: new Date().toISOString() }, { onConflict: 'setting_key' });
    }
    document.getElementById('save-ok').style.display = 'block';
    setTimeout(() => document.getElementById('save-ok').style.display = 'none', 3000);
    showToast('Saved!', 'success');
  } catch (e) { showToast('Error: ' + e.message, 'error'); }
  finally { btn.textContent = 'Save Changes'; btn.disabled = false; }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Features — TinyBloom</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="navbar-placeholder"></div>

<div class="page-header">
  <h1 id="feat-page-title">Everything You Need</h1>
  <p id="feat-page-subtitle">Discover all the tools and features TinyBloom offers to support you through every step of your pregnancy.</p>
</div>

<section class="section">
  <div class="container">
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.75rem" id="features-grid">
      <!-- Loaded dynamically from site_settings -->
    </div>
  </div>
</section>

<section style="background:var(--blush);padding:4rem 2.5rem;text-align:center">
  <h2 style="font-family:'Playfair Display',serif;font-size:1.85rem;margin-bottom:0.75rem" id="feat-cta-title">Ready to get started?</h2>
  <p style="color:var(--text-mid);margin-bottom:1.75rem" id="feat-cta-subtitle">Join TinyBloom free today. Upgrade when you're ready.</p>
  <a href="register.html" class="btn btn-primary btn-lg" id="feat-cta-btn1">Create Free Account</a>
  &nbsp;
  <a href="subscriptions.html" class="btn btn-outline btn-lg" id="feat-cta-btn2">View Pricing</a>
</section>

<div id="footer-placeholder"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/app.js"></script>
<script>
// Default feature cards data
const DEFAULT_FEATURES = [
  { icon:'👶', title:'Baby Monitor', desc:'Track your baby\'s kicks, movements, and heartbeat patterns in real-time. Get alerts for unusual activity and share reports with your doctor instantly.', badge:'✓ Free & Premium', badgeColor:'var(--rose)', badgeBg:'var(--blush)', badgeText:'var(--rose-deep)' },
  { icon:'📊', title:'Health Tracker', desc:'Monitor your weight, blood pressure, symptoms, and appointment reminders all in one place. Keep a complete pregnancy health journal with visual trends.', badge:'✓ Free & Premium', badgeColor:'var(--teal)', badgeBg:'var(--teal-light)', badgeText:'var(--teal)' },
  { icon:'👩‍⚕️', title:'Expert Consultation', desc:'Chat with volunteer doctors and specialists for free advice. Upgrade to premium for one-on-one video consultations and personalized care from verified specialists.', badge:'⭐ Premium Feature (Video)', badgeColor:'var(--gold)', badgeBg:'#fef3e2', badgeText:'#9a6b1c' },
  { icon:'🤖', title:'AI Recommendations', desc:'Get personalised weekly tips, nutrition advice, and health guidelines based on your trimester, health profile, and specific needs. Powered by advanced AI.', badge:'⭐ Premium Feature', badgeColor:'var(--rose-deep)', badgeBg:'var(--blush)', badgeText:'var(--rose-deep)' },
  { icon:'📚', title:'Education Support', desc:'Expert-guided tips on breastfeeding, pumping schedules, and latching techniques. Access video tutorials and in-depth guides curated by certified professionals.', badge:'⭐ Full Library (Premium)', badgeColor:'#a78bfa', badgeBg:'#f3f0ff', badgeText:'#7c3aed' },
  { icon:'📅', title:'Appointment Reminders', desc:'Never miss a prenatal check-up. Set reminders for scans, blood tests, and doctor visits. Sync with your calendar and share with your next of kin.', badge:'✓ Free & Premium', badgeColor:'var(--teal)', badgeBg:'var(--teal-light)', badgeText:'var(--teal)' },
  { icon:'💑', title:'Family Portal', desc:'Invite your partner or next of kin to stay updated on pregnancy milestones, appointments, and health summaries — keeping your support network connected.', badge:'✓ All Account Types', badgeColor:'var(--gold)', badgeBg:'#fef3e2', badgeText:'#9a6b1c' },
  { icon:'📰', title:'Pregnancy Articles & FAQ', desc:'Browse our curated library of articles and frequently asked questions written by medical experts. From first trimester to postpartum care.', badge:'✓ Free for All', badgeColor:'var(--sage)', badgeBg:'#eef6f2', badgeText:'var(--sage)' },
];

async function loadFeaturesPage() {
  try {
    const { data } = await supabaseClient.from('site_settings').select('setting_key, setting_value');
    const s = {};
    if (data) data.forEach(r => { s[r.setting_key] = r.setting_value; });

    // Page header
    if (s.feat_page_title) document.getElementById('feat-page-title').textContent = s.feat_page_title;
    if (s.feat_page_subtitle) document.getElementById('feat-page-subtitle').textContent = s.feat_page_subtitle;
    if (s.feat_cta_title) document.getElementById('feat-cta-title').textContent = s.feat_cta_title;
    if (s.feat_cta_subtitle) document.getElementById('feat-cta-subtitle').textContent = s.feat_cta_subtitle;
    if (s.feat_cta_btn1) document.getElementById('feat-cta-btn1').textContent = s.feat_cta_btn1;
    if (s.feat_cta_btn2) document.getElementById('feat-cta-btn2').textContent = s.feat_cta_btn2;

    // Feature cards — use dynamic card count from DB
    const count = parseInt(s['feat_card_count'] || '8');
    const grid = document.getElementById('features-grid');
    const cards = [];
    for (let i = 1; i <= count; i++) {
      const def = DEFAULT_FEATURES[i - 1] || DEFAULT_FEATURES[DEFAULT_FEATURES.length - 1];
      const title = s['feat_card' + i + '_title'] || def.title;
      const desc  = s['feat_card' + i + '_desc']  || def.desc;
      const badge = s['feat_card' + i + '_badge'] || def.badge;
      cards.push(`
        <div class="card" style="border-top:3px solid ${def.badgeColor}">
          <div style="font-size:2rem;margin-bottom:1rem">${def.icon}</div>
          <h3 style="font-family:'Playfair Display',serif;font-size:1.2rem;margin-bottom:0.5rem">${title}</h3>
          <p style="font-size:0.9rem;color:var(--text-mid)">${desc}</p>
          <div style="margin-top:1rem;padding:0.65rem 0.85rem;background:${def.badgeBg};border-radius:var(--radius-sm);font-size:0.8rem;color:${def.badgeText};font-weight:600">${badge}</div>
        </div>`);
    }
    grid.innerHTML = cards.join('');
  } catch {}
}

document.addEventListener('DOMContentLoaded', loadFeaturesPage);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In — TinyBloom</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="navbar-placeholder"></div>

<div style="background:var(--blush);min-height:calc(100vh - 70px);display:flex;align-items:center;justify-content:center;padding:3rem 1.5rem;">
  <div style="width:100%;max-width:440px;">

    <div class="form-card">
      <div style="text-align:center;margin-bottom:1.75rem">
        <a href="index.html" style="font-family:'Playfair Display',serif;font-size:1.75rem;color:var(--rose-deep);text-decoration:none">TinyBloom</a>
        <p style="font-size:0.85rem;color:var(--text-light);margin-top:0.35rem">Welcome back</p>
      </div>

      <div class="form-group">
        <label for="login-email">Email Address</label>
        <input type="email" id="login-email" placeholder="e.g. sarah@example.com" />
      </div>
      <div class="form-group">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" placeholder="Your password" />
      </div>

      <div style="text-align:right;margin-top:-0.5rem;margin-bottom:1.25rem">
        <a href="reset-password.html" style="font-size:0.82rem;color:var(--text-light)">Forgot password?</a>
      </div>

      <div style="color:#e05c5c;font-size:0.82rem;margin-bottom:0.75rem;display:none" id="login-error"></div>

      <button class="btn btn-primary" style="width:100%;justify-content:center;padding:0.8rem" onclick="handleLogin()" id="login-btn">
        Log In
      </button>

      <div class="divider"></div>
      <p style="text-align:center;font-size:0.85rem;color:var(--text-light)">
        Don't have an account? <a href="register.html">Register here</a>
      </p>

      <!-- Admin credentials box -->
      <div style="margin-top:1.5rem;background:#f0f9f9;border:1.5px solid var(--teal);border-radius:var(--radius-sm);padding:1rem 1.1rem;">
        <div style="font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--teal);margin-bottom:0.6rem">Admin Credentials</div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.4rem">
          <span style="font-size:0.82rem;color:var(--text-mid)">Email</span>
          <code style="font-size:0.82rem;background:white;padding:0.15rem 0.5rem;border-radius:4px;border:1px solid rgba(91,158,160,0.3)">admin@tinybloom.com</code>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span style="font-size:0.82rem;color:var(--text-mid)">Password</span>
          <code style="font-size:0.82rem;background:white;padding:0.15rem 0.5rem;border-radius:4px;border:1px solid rgba(91,158,160,0.3)">TinyBloom@Admin2024!</code>
        </div>
      </div>

    </div>
  </div>
</div>

<div id="footer-placeholder"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/app.js"></script>
<script>
  // Show registered success message
  if (new URLSearchParams(window.location.search).get('registered')) {
    document.addEventListener('DOMContentLoaded', () => {
      const msg = document.createElement('div');
      msg.style.cssText = 'background:#eef6f2;border-radius:var(--radius-sm);padding:0.85rem 1.25rem;font-size:0.88rem;color:var(--sage);margin-bottom:1.5rem;border-left:3px solid var(--sage)';
      msg.textContent = '✓ Account created! Please verify your email, then log in below.';
      document.querySelector('.form-card').prepend(msg);
    });
  }

  // If already logged in, redirect appropriately
  document.addEventListener('DOMContentLoaded', async () => {
    try {
      const { data:{ user } } = await supabaseClient.auth.getUser();
      if (!user) return;
      const { data: profile } = await supabaseClient.from('profiles').select('role').eq('id', user.id).single();
      if (profile?.role === 'admin' || user.email === 'admin@tinybloom.com') {
        window.location.replace('admin/index.html');
      } else if (profile) {
        window.location.replace('download.html');
      }
    } catch {}
  });

  document.getElementById('login-password').addEventListener('keypress', e => {
    if (e.key === 'Enter') handleLogin();
  });

  async function handleLogin() {
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    const errEl = document.getElementById('login-error');
    const btn = document.getElementById('login-btn');
    errEl.style.display = 'none';

    if (!email || !password) {
      errEl.textContent = 'Please enter your email and password.';
      errEl.style.display = 'block'; return;
    }

    btn.textContent = 'Logging in...'; btn.disabled = true;

    try {
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) throw new Error('Wrong email or password.');

      // Check if admin
      if (email === 'admin@tinybloom.com' || data.user?.user_metadata?.role === 'admin') {
        window.location.replace('admin/index.html'); return;
      }

      // Check profile role
      const { data: profile } = await supabaseClient
        .from('profiles').select('role').eq('id', data.user.id).single();

      if (profile?.role === 'admin') {
        window.location.replace('admin/index.html');
      } else {
        // All other registered users go to download page
        window.location.replace('download.html');
      }

    } catch (e) {
      errEl.textContent = e.message || 'Login failed.';
      errEl.style.display = 'block';
      btn.textContent = 'Log In'; btn.disabled = false;
    }
  }
</script>
</body>
</html>

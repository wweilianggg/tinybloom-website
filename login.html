<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In — TinyBloom</title>
  <!-- Capture the raw URL hash/search the instant the page parses, before the
       Supabase SDK (loaded below) gets a chance to auto-parse/strip the
       #access_token=... fragment. This is the only thing we read from later —
       never window.location directly — so SDK URL cleanup can't race us. -->
  <script>
    window.__tbAuthHash = window.location.hash;
    window.__tbAuthSearch = window.location.search;
  </script>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <div id="navbar-placeholder"></div>

  <div
    style="background:var(--blush);min-height:calc(100vh - 70px);display:flex;align-items:center;justify-content:center;padding:3rem 1.5rem;">
    <div style="width:100%;max-width:440px;">

      <div class="form-card">
        <div style="text-align:center;margin-bottom:1.75rem">
          <a href="index.html"
            style="font-family:'Playfair Display',serif;font-size:1.75rem;color:var(--rose-deep);text-decoration:none">TinyBloom</a>
          <p id="login-subtitle" style="font-size:0.85rem;color:var(--text-light);margin-top:0.35rem">Welcome back</p>
        </div>

        <div class="form-group">
          <label for="login-email">Email Address</label>
          <input type="email" id="login-email" placeholder="e.g. sarah@example.com" />
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" placeholder="Your password" />
        </div>

        <div style="text-align:right;margin-top:-0.5rem;margin-bottom:1.25rem">
          <a href="reset-password.html" style="font-size:0.82rem;color:var(--text-light)">Forgot password?</a>
        </div>

        <div style="color:#e05c5c;font-size:0.82rem;margin-bottom:0.75rem;display:none" id="login-error"></div>

        <button class="btn btn-primary" style="width:100%;justify-content:center;padding:0.8rem" onclick="handleLogin()"
          id="login-btn">
          Log In
        </button>

        <div class="divider"></div>
        <p style="text-align:center;font-size:0.85rem;color:var(--text-light)">
          Don't have an account? <a href="register.html">Register here</a>
        </p>

      </div>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/app.js"></script>
  <script>
    // ---- Email-verification handling (replaces login-verification.html) ----
    //
    // If this page was loaded as the redirect target of a Supabase signup
    // confirmation link, it'll carry either #access_token=... (implicit flow)
    // or ?code=... (PKCE flow), plus &type=signup. We never trust those raw
    // values ourselves — we hand them to the SDK, which validates them against
    // Supabase and only succeeds if the one-time token was genuine and unused.

    function cleanAuthParamsFromUrl() {
      const url = new URL(window.location.href);
      url.searchParams.delete('code');
      url.searchParams.delete('type');
      url.hash = '';
      history.replaceState(null, '', url.pathname + url.search);
    }

    // Returns true if this load was (successfully or not) a verification
    // redirect, so the caller knows to skip the normal "already logged in"
    // auto-redirect below.
    async function handleEmailVerificationIfPresent() {
      const searchParams = new URLSearchParams(window.__tbAuthSearch || '');
      const hashParams = new URLSearchParams((window.__tbAuthHash || '').replace(/^#/, ''));

      const hasCode = searchParams.get('code');
      const hasHashToken = hashParams.get('access_token');
      if (!hasCode && !hasHashToken) return false; // ordinary page load

      const verificationType = hashParams.get('type') || searchParams.get('type');
      const errEl = document.getElementById('login-error');

      try {
        let sessionEstablished = false;

        if (hasCode) {
          const { data, error } = await supabaseClient.auth.exchangeCodeForSession(window.location.href);
          if (error) throw error;
          sessionEstablished = !!data?.session;
        }
        if (!sessionEstablished) {
          const { data: { session } } = await supabaseClient.auth.getSession();
          sessionEstablished = !!session;
        }

        cleanAuthParamsFromUrl();

        if (!sessionEstablished) throw new Error('This verification link is invalid or has expired.');

        if (verificationType && verificationType !== 'signup') {
          // Recovery/invite links shouldn't claim to be email verification.
          return false;
        }

        // Don't silently leave them signed in from an email click — they
        // should still log in explicitly with their password.
        await supabaseClient.auth.signOut();

        const subtitle = document.getElementById('login-subtitle');
        if (subtitle) subtitle.textContent = '✅ Thanks for verifying your email, log in below!';

        return true;
      } catch (e) {
        cleanAuthParamsFromUrl();
        errEl.textContent = e.message || 'This verification link is invalid or has expired.';
        errEl.style.display = 'block';
        return true;
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const wasVerificationRedirect = await handleEmailVerificationIfPresent();
      if (wasVerificationRedirect) return; // subtitle/error already set above

      // Ordinary load: if already logged in, route to the right place.
      try {
        const { data: { user } } = await supabaseClient.auth.getUser();
        if (!user) return;
        if (!user.email_confirmed_at) {
          window.location.replace('email-verification.html');
          return;
        }
        const { data: profile } = await supabaseClient.from('profiles').select('role').eq('id', user.id).single();
        if (profile?.role === 'admin') {
          window.location.replace('admin/index.html');
        } else if (profile) {
          window.location.replace('download.html');
        }
      } catch { }
    });

    // Show registered success message
    if (new URLSearchParams(window.__tbAuthSearch || '').get('registered')) {
      document.addEventListener('DOMContentLoaded', () => {
        const msg = document.createElement('div');
        msg.style.cssText = 'background:#eef6f2;border-radius:var(--radius-sm);padding:0.85rem 1.25rem;font-size:0.88rem;color:var(--sage);margin-bottom:1.5rem;border-left:3px solid var(--sage)';
        msg.textContent = '✓ Account created! Please verify your email, then log in below.';
        document.querySelector('.form-card').prepend(msg);
      });
    }

    document.getElementById('login-password').addEventListener('keypress', e => {
      if (e.key === 'Enter') handleLogin();
    });

    async function handleLogin() {
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const errEl = document.getElementById('login-error');
      const btn = document.getElementById('login-btn');
      errEl.style.display = 'none';

      if (!email || !password) {
        errEl.textContent = 'Please enter your email and password.';
        errEl.style.display = 'block'; return;
      }

      btn.textContent = 'Logging in...'; btn.disabled = true;

      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) throw error;

        // Check profile role and status
        const { data: loginProfile, error: profileError } = await supabaseClient
          .from('profiles')
          .select('role, is_active')
          .eq('id', data.user.id)
          .single();

        if (profileError) throw profileError;

        // Admin goes to admin panel
        if (loginProfile?.role === 'admin') {
          window.location.replace('admin/index.html');
          return;
        }

        // Specialist cannot login until admin approves
        if (loginProfile?.role === 'specialist' && loginProfile?.is_active === false) {
          await supabaseClient.auth.signOut();

          errEl.textContent = 'Your specialist application is pending admin approval.';
          errEl.style.display = 'block';

          btn.textContent = 'Log In';
          btn.disabled = false;
          return;
        }

        // Next of kin: finish linking to the mum's account now that we have
        // a real session (metadata was set at signup but couldn't be written
        // to next_of_kin_profiles until RLS could see an authenticated user).
        if (loginProfile?.role === 'next_of_kin') {
          try {
            const { data: { user: fullUser } } = await supabaseClient.auth.getUser();
            const meta = fullUser?.user_metadata || {};
            if (meta.linked_pregnant_user_id) {
              const { data: existingLink } = await supabaseClient
                .from('next_of_kin_profiles')
                .select('id')
                .eq('user_id', data.user.id)
                .maybeSingle();
              if (!existingLink) {
                await supabaseClient.from('next_of_kin_profiles').insert({
                  user_id: data.user.id,
                  linked_pregnant_user_id: meta.linked_pregnant_user_id,
                  relationship: meta.relationship || null
                });
              }
            }
          } catch (linkErr) {
            console.error('Next-of-kin link completion failed:', linkErr);
          }
        }

        // Volunteer cannot login until admin approves (volunteer rejections are
        // soft-rejects, so is_active alone can't distinguish pending vs rejected)
        if (loginProfile?.role === 'volunteer' && loginProfile?.is_active === false) {
          const { data: volunteerProfile } = await supabaseClient
            .from('volunteer_profiles')
            .select('approval_status')
            .eq('user_id', data.user.id)
            .single();

          await supabaseClient.auth.signOut();

          errEl.textContent = volunteerProfile?.approval_status === 'rejected'
            ? 'Your volunteer application was not approved. Please contact support.'
            : 'Your volunteer application is pending admin approval.';
          errEl.style.display = 'block';

          btn.textContent = 'Log In';
          btn.disabled = false;
          return;
        }

        // All approved/normal users go to download page
        window.location.replace('download.html');
        return;

      } catch (e) {
        errEl.textContent = e.message || 'Login failed.';
        errEl.style.display = 'block';
        btn.textContent = 'Log In'; btn.disabled = false;
      }
    }
  </script>
</body>

</html>

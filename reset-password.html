<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — TinyBloom</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="navbar-placeholder"></div>

<div style="background:var(--blush);min-height:calc(100vh - 70px);display:flex;align-items:center;justify-content:center;padding:3rem 1.5rem;">
  <div style="width:100%;max-width:420px;">

    <!-- Request reset form -->
    <div class="form-card" id="request-form">
      <div style="text-align:center;margin-bottom:1.75rem">
        <a href="index.html" style="font-family:'Playfair Display',serif;font-size:1.75rem;color:var(--rose-deep);text-decoration:none">TinyBloom</a>
        <p style="font-size:0.85rem;color:var(--text-light);margin-top:0.35rem">Reset your password</p>
      </div>
      <div class="form-group">
        <label for="reset-email">Email Address</label>
        <input type="email" id="reset-email" placeholder="Enter your account email" />
      </div>
      <div style="color:#e05c5c;font-size:0.82rem;margin-bottom:0.75rem;display:none" id="reset-error"></div>
      <div class="form-success" id="reset-success">Password reset email sent! Check your inbox.</div>
      <button class="btn btn-primary" style="width:100%;justify-content:center;padding:0.8rem" onclick="sendReset()" id="reset-btn">Send Reset Email</button>
      <p style="text-align:center;font-size:0.85rem;color:var(--text-light);margin-top:1rem"><a href="login.html">← Back to Login</a></p>
    </div>

    <!-- New password form (shown if URL has access_token from Supabase) -->
    <div class="form-card" id="new-password-form" style="display:none">
      <div style="text-align:center;margin-bottom:1.75rem">
        <a href="index.html" style="font-family:'Playfair Display',serif;font-size:1.75rem;color:var(--rose-deep);text-decoration:none">TinyBloom</a>
        <p style="font-size:0.85rem;color:var(--text-light);margin-top:0.35rem">Set a new password</p>
      </div>
      <div class="form-group">
        <label for="new-password">New Password</label>
        <input type="password" id="new-password" placeholder="Min. 8 characters" />
      </div>
      <div class="form-group">
        <label for="confirm-new-password">Confirm New Password</label>
        <input type="password" id="confirm-new-password" placeholder="Re-enter new password" />
      </div>
      <div style="color:#e05c5c;font-size:0.82rem;margin-bottom:0.75rem;display:none" id="newpw-error"></div>
      <button class="btn btn-primary" style="width:100%;justify-content:center;padding:0.8rem" onclick="updatePassword()" id="newpw-btn">Update Password</button>
    </div>
  </div>
</div>

<div id="footer-placeholder"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/app.js"></script>
<script>
// Check if this is a password recovery redirect
document.addEventListener('DOMContentLoaded', async () => {
  const hash = window.location.hash;
  if (hash.includes('type=recovery') || hash.includes('access_token')) {
    document.getElementById('request-form').style.display = 'none';
    document.getElementById('new-password-form').style.display = 'block';
  }
});

async function sendReset() {
  const email = document.getElementById('reset-email').value.trim();
  const errEl = document.getElementById('reset-error');
  const btn = document.getElementById('reset-btn');
  errEl.style.display = 'none';
  if (!email) { errEl.textContent = 'Please enter your email.'; errEl.style.display = 'block'; return; }

  btn.textContent = 'Sending...'; btn.disabled = true;
  try {
    const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + '/reset-password.html',
    });
    if (error) throw error;
    document.getElementById('reset-success').style.display = 'block';
    btn.style.display = 'none';
  } catch (e) {
    errEl.textContent = e.message || 'Failed to send reset email.';
    errEl.style.display = 'block';
    btn.textContent = 'Send Reset Email'; btn.disabled = false;
  }
}

async function updatePassword() {
  const pw = document.getElementById('new-password').value;
  const confirm = document.getElementById('confirm-new-password').value;
  const errEl = document.getElementById('newpw-error');
  const btn = document.getElementById('newpw-btn');
  errEl.style.display = 'none';
  if (pw.length < 8) { errEl.textContent = 'Password must be at least 8 characters.'; errEl.style.display = 'block'; return; }
  if (pw !== confirm) { errEl.textContent = 'Passwords do not match.'; errEl.style.display = 'block'; return; }

  btn.textContent = 'Updating...'; btn.disabled = true;
  try {
    const { error } = await supabaseClient.auth.updateUser({ password: pw });
    if (error) throw error;
    showToast('Password updated! Redirecting...', 'success');
    setTimeout(() => window.location.href = 'login.html', 1800);
  } catch (e) {
    errEl.textContent = e.message || 'Failed to update password.';
    errEl.style.display = 'block';
    btn.textContent = 'Update Password'; btn.disabled = false;
  }
}
</script>
</body>
</html>
